name: Nightly Database Backup

# Runs automatically every night, and can also be triggered manually from
# the Actions tab (useful right before a risky change, e.g. a migration).
on:
  schedule:
    - cron: "0 2 * * *" # 2am UTC daily - adjust to whenever load is lowest
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Install AWS CLI (Backblaze B2 is S3-compatible, so this works unchanged)
        run: pip install --quiet awscli

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y-%m-%d_%H-%M-%S)
          FILENAME="executive-hostel-${TIMESTAMP}.sql.gz"
          echo "BACKUP_FILE=${FILENAME}" >> "$GITHUB_ENV"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > "$FILENAME"
          echo "Dump size: $(du -h "$FILENAME" | cut -f1)"

      - name: Upload to Backblaze B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          aws --endpoint-url "${{ secrets.BACKUP_S3_ENDPOINT }}" \
            s3 cp "$BACKUP_FILE" "s3://${{ secrets.BACKUP_S3_BUCKET }}/$BACKUP_FILE"
          echo "Uploaded $BACKUP_FILE"

      - name: Prune backups older than 30 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d "30 days ago" +%Y-%m-%d)
          aws --endpoint-url "${{ secrets.BACKUP_S3_ENDPOINT }}" \
            s3 ls "s3://${{ secrets.BACKUP_S3_BUCKET }}/" | awk '{print $4}' | while read -r key; do
              [ -z "$key" ] && continue
              FILE_DATE=$(echo "$key" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
              if [ -n "$FILE_DATE" ] && [ "$FILE_DATE" \< "$CUTOFF" ]; then
                echo "Deleting old backup: $key"
                aws --endpoint-url "${{ secrets.BACKUP_S3_ENDPOINT }}" \
                  s3 rm "s3://${{ secrets.BACKUP_S3_BUCKET }}/$key"
              fi
            done
